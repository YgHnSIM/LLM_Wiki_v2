schema_version: 1

initiative:
  id: llm-system-boundary-network
  title: LLM 시스템 경계 확장
  current_batch: realtime-owner
  next_action: >-
    npm run boundary:resume으로 재개 상태를 확인한 뒤, realtime-owner 배치에서
    실시간 멀티모달 상호작용 owner를 만들고 media clock·frame/chunk·buffer·turn detection·incremental output·A/V sync·interrupt·cancel·backpressure·full-duplex의 경계를 근거와 함께 완결한다.
  blockers: []
  hub:
    path: wiki/meta/LLM 시스템 경계 확장 지도.md
    page_id: meta.llm-system-boundary-map
    title: LLM 시스템 경계 확장 지도
    stage: planned
  handoff:
    updated: '2026-07-25'
    baseline_commit: 309909569bd2ae5ccab822d6ea2fdfb67fd77d40
    last_completed_batch: safe-effects
    last_completed_gate: safe-external-effects-verified
    validation:
      - boundary:check
      - history:check
      - math:check
      - learning:audit:check
      - verify
    recovery:
      - npm run boundary:resume
      - npm run boundary:check
      - git status --short --branch
    notes: >-
      safe-effects에서 함수 호출과 agent의 action 상태 기계, unknown reconciliation,
      partial effect·compensation·postcondition·audit 경계를 검증해 완료했고,
      다음 유일한 행동은 realtime-owner다.
      이 원장이 세션 전환·문맥 압축 뒤에도 배치 순서와 다음 행동을 복원하는 단일 기준이다.
      raw/, C:/Vault/CS_Wiki와 사용자 첨부 파일은 수정하거나 staging하지 않는다.

boundary_slots:
  - 입력·대상
  - 변환 경로
  - 시간·상태·자원
  - 결과 계약
  - 지표·평가 기준
  - 실패·복구 경계
  - 권한·책임·출처 추적

