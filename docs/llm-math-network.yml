families:
  - id: vectors-matrices-tensors
    title: 벡터·행렬·텐서와 shape
    domain: linear-algebra
    coverage: ready
    owner:
      path: wiki/concepts/벡터·행렬·텐서와 shape.md
      id: concept.벡터-행렬-텐서와-shape
    prerequisites: []
    downstream:
      - wiki/concepts/단어 임베딩.md
      - wiki/concepts/어텐션 메커니즘.md
      - wiki/concepts/Transformer.md
      - wiki/concepts/Layer Normalization.md
    notes: >-
      스칼라·벡터·행렬·텐서, 축, 인덱스, shape와 broadcasting의 경계를 맡는다.
      내적·가중합·행렬곱·bias는 dot-matrix-linear-transform owner로 넘긴다.

  - id: dot-matrix-linear-transform
    title: 내적·행렬곱과 선형변환
    domain: linear-algebra
    coverage: ready
    owner:
      path: wiki/concepts/내적·행렬곱과 선형변환.md
      id: concept.내적-행렬곱과-선형변환
    prerequisites:
      - vectors-matrices-tensors
    downstream:
      - wiki/concepts/코사인 유사도.md
      - wiki/concepts/단어 임베딩.md
      - wiki/concepts/어텐션 메커니즘.md
      - wiki/concepts/Transformer.md
      - wiki/concepts/저순위 적응.md
    notes: >-
      가중합·내적·행렬곱·선형변환과 bias의 서로 다른 역할을 맡는다.
      객체 종류·축·shape와 broadcasting의 정의는 vectors-matrices-tensors owner를 전제로 한다.

  - id: embeddings
    title: 임베딩 조회와 연속 표현
    domain: representation
    coverage: ready
    owner:
      path: wiki/concepts/단어 임베딩.md
      id: concept.단어-임베딩
    prerequisites:
      - vectors-matrices-tensors
    downstream:
      - wiki/concepts/신경 확률 언어 모형.md
      - wiki/concepts/Transformer.md
    notes: 새 선형대수 기준 문서와 연결했고, 현재의 ID 조회·행렬 shape·정적 표현 설명은 국소 책임으로 유지한다.

  - id: probability
    title: 확률과 확률모형
    domain: probability
    coverage: ready
    owner:
      path: wiki/concepts/확률.md
      id: concept.확률
    prerequisites: []
    downstream:
      - wiki/concepts/조건부 확률.md
      - wiki/concepts/N-gram 모델.md
      - wiki/concepts/소프트맥스.md
    notes: 유한 이산 예에서 사건·분포·합 1의 의미를 맡는다.

  - id: conditional-chain-rule
    title: 조건부확률과 자기회귀 연쇄
    domain: probability
    coverage: ready
    owner:
      path: wiki/concepts/조건부 확률.md
      id: concept.조건부-확률
    prerequisites:
      - probability
    downstream:
      - wiki/concepts/로그가능도.md
      - wiki/concepts/자기회귀 생성.md
      - wiki/concepts/대규모 언어 모델.md
    notes: 조건부확률 정의와 sequence 결합확률의 연쇄 규칙을 구분한다.

  - id: exponential-logarithm
    title: 지수와 로그
    domain: elementary-functions
    coverage: ready
    owner:
      path: wiki/concepts/지수와 로그.md
      id: concept.지수와-로그
    prerequisites: []
    downstream:
      - wiki/concepts/소프트맥스.md
      - wiki/concepts/로그가능도.md
      - wiki/concepts/Perplexity.md
    notes: 역함수·곱을 합으로 바꾸는 성질·밑·정의역과 수치 범위를 맡는다.

  - id: softmax
    title: 로짓을 범주형 확률분포로 바꾸는 softmax
    domain: probability
    coverage: ready
    owner:
      path: wiki/concepts/소프트맥스.md
      id: concept.소프트맥스
    prerequisites:
      - probability
      - exponential-logarithm
    downstream:
      - wiki/concepts/어텐션 메커니즘.md
      - wiki/concepts/Transformer.md
      - wiki/concepts/로그가능도.md
    notes: 양수화·정규화·shift invariance와 확률 해석의 한계를 맡는다.

  - id: log-likelihood
    title: 로그가능도와 음의 로그가능도
    domain: statistics
    coverage: ready
    owner:
      path: wiki/concepts/로그가능도.md
      id: concept.로그-가능도
    prerequisites:
      - conditional-chain-rule
      - exponential-logarithm
    downstream:
      - wiki/concepts/GPT-1과 GPT-2.md
      - wiki/concepts/Perplexity.md
      - wiki/concepts/대규모 언어 모델.md
    notes: 확률·가능도·사후확률, MLE, NLL과 조건부 연쇄의 관계를 맡는다.

  - id: entropy-cross-entropy-kl
    title: 엔트로피·교차 엔트로피·KL 발산
    domain: information-theory
    coverage: ready
    owner:
      path: wiki/concepts/엔트로피·교차 엔트로피·KL 발산.md
      id: concept.엔트로피-교차-엔트로피-kl-발산
    prerequisites:
      - probability
      - exponential-logarithm
      - log-likelihood
    downstream:
      - wiki/concepts/CLIP.md
      - wiki/concepts/인간 피드백 강화학습.md
      - wiki/concepts/그룹 상대 정책 최적화.md
    notes: 정보량·평균 부호 길이 해석·교차 엔트로피·KL을 한 owner에 둔다.
      one-hot 정답에서의 NLL 일치와 서로 다른 분포·지원집합에서의 해석 한계를 맡는다.

  - id: perplexity
    title: 평균 로그손실의 지수 변환과 Perplexity
    domain: evaluation
    coverage: ready
    owner:
      path: wiki/concepts/Perplexity.md
      id: concept.perplexity
    prerequisites:
      - log-likelihood
      - exponential-logarithm
    downstream:
      - wiki/concepts/언어 모델 스케일링 법칙.md
      - wiki/concepts/대규모 언어 모델.md
    notes: tokenization과 평가 집합이 다른 값을 직접 비교하지 못하는 경계를 포함한다.

  - id: attention
    title: scaled dot-product attention
    domain: architecture
    coverage: ready
    owner:
      path: wiki/concepts/어텐션 메커니즘.md
      id: concept.어텐션-메커니즘
    prerequisites:
      - dot-matrix-linear-transform
      - softmax
    downstream:
      - wiki/concepts/Transformer.md
      - wiki/concepts/FlashAttention.md
    notes: Q·K·V, scaling, mask, softmax와 가중합의 각각 다른 역할을 맡으며 선형 투영·내적 owner를 국소 설명과 함께 연결했다.

  - id: derivative-partial-gradient
    title: 미분·편미분·그래디언트
    domain: calculus
    coverage: ready
    owner:
      path: wiki/concepts/미분·편미분·그래디언트.md
      id: concept.미분-편미분-그래디언트
    prerequisites: []
    downstream:
      - wiki/concepts/경사하강법.md
      - wiki/concepts/역전파.md
      - wiki/concepts/Adam 최적화기.md
    notes: >-
      한 변수 변화율, 편미분, 방향미분과 그래디언트의 정의·shape·국소 근사를 맡는다.
      해석적 기울기 8과 중심 차분 8의 일치를 확인했다.
      합성 경로를 따라 미분을 곱하고 합치는 규칙은 chain-rule-computation-graph owner로 넘긴다.

  - id: chain-rule-computation-graph
    title: 연쇄 법칙과 계산 그래프
    domain: calculus
    coverage: ready
    owner:
      path: wiki/concepts/연쇄 법칙과 계산 그래프.md
      id: concept.연쇄-법칙과-계산-그래프
    prerequisites:
      - derivative-partial-gradient
    downstream:
      - wiki/concepts/역전파.md
      - wiki/concepts/순환 신경망.md
    notes: >-
      합성함수의 국소 도함수, 재사용 노드로 들어오는 여러 경로의 합, 역모드 누적을 맡는다.
      $a=wx+b$, $J=(a-y)^2$와 재사용 노드 예를 손으로 검증했다.
      도함수·편미분·그래디언트의 정의와 방향 해석은 derivative-partial-gradient owner를 전제로 한다.

  - id: gradient-descent
    title: 그래디언트 기반 매개변수 갱신
    domain: optimization
    coverage: ready
    owner:
      path: wiki/concepts/경사하강법.md
      id: concept.경사하강법
    prerequisites:
      - derivative-partial-gradient
    downstream:
      - wiki/concepts/Adam 최적화기.md
      - wiki/concepts/대규모 언어 모델.md
    notes: >-
      명시적 갱신식, $J(w)=(2w-1)^2$의 한 걸음, 중심 차분 확인,
      batch·SGD·Adam의 역할 차이와 비볼록·학습률 한계를 보강했다.

  - id: backpropagation
    title: 역모드 자동미분과 역전파
    domain: calculus
    coverage: ready
    owner:
      path: wiki/concepts/역전파.md
      id: concept.역전파
    prerequisites:
      - chain-rule-computation-graph
    downstream:
      - wiki/concepts/다층 퍼셉트론.md
      - wiki/concepts/Transformer.md
      - wiki/concepts/순환 신경망.md
    notes: >-
      연쇄 법칙의 생략 없는 scalar 유도와
      $W\in\mathbb R^{r\times d}$의 outer-product gradient shape 예를 추가했다.

  - id: adam
    title: 모멘트 추정과 Adam 갱신
    domain: optimization
    coverage: ready
    owner:
      path: wiki/concepts/Adam 최적화기.md
      id: concept.adam-최적화기
    prerequisites:
      - gradient-descent
      - random-variable-expectation-variance
    downstream:
      - wiki/concepts/대규모 언어 모델.md
    notes: 지수이동평균, bias correction, 좌표별 scaling과 수렴 한계를 분리하고 one-coordinate 첫 update와 raw second moment·분산 경계를 확인했다.

  - id: random-variable-expectation-variance
    title: 확률변수·확률분포·기대값·분산
    domain: statistics
    coverage: ready
    owner:
      path: wiki/concepts/확률변수·확률분포·기대값·분산.md
      id: concept.확률변수-확률분포-기대값-분산
    prerequisites:
      - probability
    downstream:
      - wiki/concepts/Layer Normalization.md
      - wiki/concepts/Adam 최적화기.md
      - wiki/concepts/그룹 상대 정책 최적화.md
    notes: 관측 평균·모집단 기대값·분산·표준편차와 축 선택을 구분하고 LayerNorm·Adam·GRPO의 현재 역할을 연결했다.

  - id: residual-connections
    title: 잔차 덧셈과 항등 경로
    domain: architecture
    coverage: ready
    owner:
      path: wiki/concepts/잔차 연결.md
      id: concept.잔차-연결
    prerequisites:
      - vectors-matrices-tensors
    downstream:
      - wiki/concepts/Transformer.md
      - wiki/concepts/Layer Normalization.md
    notes: shape가 같은 항등 경로와 학습 branch의 덧셈, Jacobian 해석의 범위를 맡으며 shape·투영 owner를 국소 설명과 함께 연결했다.

  - id: normalization-statistics
    title: 평균·분산과 특징 정규화
    domain: statistics
    coverage: ready
    owner:
      path: wiki/concepts/Layer Normalization.md
      id: concept.layer-normalization
    prerequisites:
      - vectors-matrices-tensors
