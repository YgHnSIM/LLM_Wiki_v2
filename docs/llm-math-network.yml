schema_version: 1

initiative:
  id: llm-math-network
  title: LLM을 만든 수학
  hub:
    path: wiki/analyses/LLM을 만든 수학.md
    id: analysis.llm을-만든-수학
    batch: hub-publication
    stage: complete
  current_batch: null
  next_action: >-
    npm run math:check를 실행한 뒤, 다음 접근성 보강 후보가 생기면 wiki/concepts/확률.md의 probability와 wiki/concepts/조건부 확률.md의 conditional-chain-rule owner의 설명 책임을 겹치지 않는 독립 학습 질문·최소 예·대표 소비 문서로 먼저 판정하고 사용자 범위에 맞는 한 배치를 제안한다.
  blockers: []
  handoff:
    updated: '2026-07-24'
    baseline_commit: de9b3c0188b2d95717fab18eade56ad116eeeaf9
    last_completed_gate: probability-notation-accessibility-g7-verified
    validation:
      - command: npm run math:check
        result: 7개 배치·25개 수식 계열의 구조·owner·선수 관계와 확률 표기 보강 배치 완료 상태 검증 통과
      - command: npm run learning:audit
        result: 365개 Markdown·362개 비메타 문서, 블록 수식 691개로 기준선 갱신
      - command: npm run learning:audit:check
        result: 기초 학습 감사 기준선이 현재 wiki와 일치함을 확인
      - command: npm run sync:index
        result: 변경 문서의 evidence 수와 목록을 index에 동기화
      - command: npm run lint:wiki
        result: Markdown 365개·evidence 458건·immutable raw artifact 220개 검증 통과
      - command: BASE_PATH='' npm run verify
        result: math 원장, Node 회귀 123개, wiki lint·691 HTML build/check·Chromium 회귀 4개를 통과
    notes: >-
      기준 branch는 main이다. probability owner에는 집합 원소 수를 실제 카드 목록으로 세고 $\lvert\cdot\rvert$의 의미를 구별하는 단계를,
      conditional-chain-rule owner에는 후보 범위를 먼저 $B$로 줄인 뒤 다시 세는 단계를 추가했다.
      허브에는 $\mathcal V$ 집합·$V$ value 행렬·출력 확률 벡터 $p$를 구별하는 세 질문을 추가했고 overview에는 같은 입문 경로를 기록했다.
      생성 HTML의 세 변경 페이지에서 KaTeX error 표지 0개와 새 안내 문구를 확인했고, Chromium mobile overflow 회귀도 통과했다. raw는 바꾸지 않았다.

